name: "Setup Developer Jule Compiler"
description: "Setup Developer Jule Compiler for the Official CI actions."
author: "mertcandav"
branding:
  icon: code
  color: gray-dark
runs:
  using: "composite"
  steps:
    # Windows CI build failures caused by an incompatibility
    # between LLVM Clang and the MSVC Standard Library version.
    # Upgrade LLVM before building to ensure compatibiltiy.
    - name: Update LLVM (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco upgrade llvm -y --no-progress
        $env:Path = "C:\Program Files\LLVM\bin;$env:Path"
        clang++ --version
    - name: Get IR
      shell: bash
      run: |
        if [[ "$OSTYPE" == "darwin"* ]]; then
          curl -o ir.cpp https://raw.githubusercontent.com/julelang/julec-ir/main/src/macos-amd64.cpp
        elif [[ "$RUNNER_OS" == "Windows" ]]; then
          curl -o ir.cpp https://raw.githubusercontent.com/julelang/julec-ir/main/src/windows-amd64.cpp
        elif [[ "$RUNNER_OS" == "Linux" ]]; then
          curl -o ir.cpp https://raw.githubusercontent.com/julelang/julec-ir/main/src/linux-amd64.cpp
        else
          echo "Unsupported operating system."
          exit 1
        fi
    - name: Build Jule Compiler
      shell: bash
      run: |
        mkdir bin
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          clang++ -Wno-everything --std=c++20 -fwrapv -fno-fast-math -O3 -flto=thin -fuse-ld=lld -DNDEBUG -fomit-frame-pointer -fno-strict-aliasing -o ./bin/julec.exe ir.cpp -lws2_32 -lshell32 -liphlpapi -lsynchronization
        else
          clang++ -Wno-everything --std=c++20 -fwrapv -fno-fast-math -O3 -flto=thin -DNDEBUG -fomit-frame-pointer -fno-strict-aliasing -o ./bin/julec ir.cpp
        fi
    - name: Add Compiler to the PATH
      shell: bash
      run: |
        echo "export PATH=\$PATH:./bin/" >> $GITHUB_PATH
